<header class="masthead">
  <div class="masthead-topo">
<!-- topo sem simetria: logo, nome gigante e dados na lateral -->
    <img src="logo/Logo_EcoStats.png" alt="Logo da EcoStats" class="logo">
    <div class="masthead-titulo">{{ titulo }}</div>
    <div class="masthead-lado">
      <span>CS2 / 2026</span>
<!-- a lateral funciona como carimbo de edição -->
      <span>Dados locais</span>
      <span>Ranking ao vivo</span>
    </div>
  </div>
  <div class="ticker">
<!-- faixa de dados correndo por cima do menu -->
    <span>Paleta fria</span>
    <span>//</span>
    <span>Ranking CS2</span>
    <span>//</span>
    <span>Direto do JSON</span>
<!-- a faixa repete o separador // entre os dados -->
    <span>//</span>
    <span>Edição verde</span>
  </div>
  <nav class="menu" aria-label="Menu principal">
    <a routerLink="/home" routerLinkActive="ativo">Início</a>
<!-- o menu virou uma régua de links, sem botões redondos -->
    <a routerLink="/stats" routerLinkActive="ativo">Estatísticas</a>
    <a routerLink="/times" routerLinkActive="ativo">Times</a>
    <a routerLink="/novo" routerLinkActive="ativo">Novo jogador</a>
  </nav>
</header>
<!-- segue o markup -->
<main class="conteudo">
  <router-outlet></router-outlet>
</main>
<!-- cada rota desenha a pagina dentro da folha creme -->
