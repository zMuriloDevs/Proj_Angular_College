<header class="masthead">
  <div class="masthead-topo">
<!-- o topo imita o cabecalho de um jornal -->
    <img src="logo/Logo_EcoStats.png" alt="Logo da EcoStats" class="logo">
    <div>
      <p class="cabecalho">Edição CS2 · ranking e estatísticas</p>
      <p class="masthead-titulo">{{ titulo }}</p>
<!-- nome do site em destaque, com logo transparente do lado -->
    </div>
  </div>
  <nav class="menu" aria-label="Menu principal">
    <a routerLink="/home" routerLinkActive="ativo">Início</a>
    <a routerLink="/stats" routerLinkActive="ativo">Estatísticas</a>
<!-- os links viram uma faixa, sem botões arredondados -->
    <a routerLink="/times" routerLinkActive="ativo">Times</a>
    <a routerLink="/novo" routerLinkActive="ativo">Novo jogador</a>
  </nav>
</header>
<main class="conteudo">
<!-- segue o markup -->
  <router-outlet></router-outlet>
</main>
<!-- cada rota desenha a página dentro do painel -->
