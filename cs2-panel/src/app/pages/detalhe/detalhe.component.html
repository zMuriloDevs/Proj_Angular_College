<h1 class="manchete">Ficha do jogador</h1>
<div class="detalhe" *ngIf="!carregando && jogador; else carregandoTpl">
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ jogador.nickname }}</mat-card-title>
<!-- segue o markup -->
      <mat-card-subtitle>{{ nomeTime(jogador) }} · {{ jogador.funcao }}</mat-card-subtitle>
<!-- segue o markup -->
    </mat-card-header>
<!-- o subtítulo agora mostra o time cadastrado, não texto solto -->
    <mat-card-content>
      <div class="grade">
        <div class="caixa">
          <span class="rotulo">Mapas</span>
          <strong>{{ jogador.mapas }}</strong>
<!-- pedaço da tela -->
        </div>
        <div class="caixa">
          <span class="rotulo">Kills</span>
          <strong>{{ jogador.kills }}</strong>
        </div>
<!-- cada caixinha destaca um número da ficha -->
        <div class="caixa">
          <span class="rotulo">Deaths</span>
          <strong>{{ jogador.deaths }}</strong>
        </div>
        <div class="caixa destaque">
<!-- continuo aqui -->
          <span class="rotulo">K/D ratio</span>
          <strong>{{ kd(jogador) }}</strong>
        </div>
      </div>
<!-- o K/D vem do método do componente, igual ao ranking -->
      <p class="explicacao">Estatísticas salvas no banco local do trabalho.</p>
    </mat-card-content>
    <mat-card-actions>
      <a mat-raised-button color="primary" [routerLink]="['/editar', jogador.id]">
        <mat-icon>edit</mat-icon> Editar
<!-- parte simples -->
      </a>
      <button mat-stroked-button color="warn" (click)="excluir()">
        <mat-icon>delete</mat-icon> Excluir
      </button>
<!-- editar usa o mesmo formulário; excluir pede confirmação -->
      <button mat-button (click)="voltar()">
        <mat-icon>arrow_back</mat-icon> Voltar
      </button>
    </mat-card-actions>
  </mat-card>
<!-- segue o bloco -->
</div>
<ng-template #carregandoTpl><p>Carregando ficha do jogador...</p></ng-template>
