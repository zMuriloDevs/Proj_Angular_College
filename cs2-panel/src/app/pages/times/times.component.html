<h1 class="manchete">Times cadastrados</h1>
<p class="subtitulo">O time começa vazio. Os jogadores são vinculados no cadastro deles.</p>
<a mat-raised-button color="primary" routerLink="/time/novo" class="acao">
  <mat-icon>add</mat-icon> Novo time
</a>
<!-- botão de criar um time novo, sem jogadores -->
<div class="grade" *ngIf="!carregando; else carregandoTpl">
  <mat-card *ngFor="let time of times" class="time-card">
    <mat-card-content>
      <h2>{{ time.nome }}</h2>
      <p class="coach"><span class="tag">Coach</span> {{ time.coach }}</p>
<!-- segue o markup -->
      <p class="jogadores">{{ nomes(time) }}</p>
      <p class="quantidade">{{ doTime(time).length }} de 5 jogadores</p>
    </mat-card-content>
<!-- mostra quantas vagas foram ocupadas até agora -->
    <mat-card-actions>
      <a mat-button [routerLink]="['/time/editar', time.id]">
        <mat-icon>edit</mat-icon> Editar
      </a>
      <button mat-button color="warn" (click)="excluir(time)">
<!-- pedaço da tela -->
        <mat-icon>delete</mat-icon> Excluir
      </button>
    </mat-card-actions>
<!-- editar muda só nome e coach; excluir libera os jogadores -->
  </mat-card>
</div>
<ng-template #carregandoTpl><p>Carregando times...</p></ng-template>
<p class="vazio" *ngIf="!carregando && times.length === 0">
  Nenhum time cadastrado ainda.
<!-- continuo aqui -->
</p>
